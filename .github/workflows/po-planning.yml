name: PO Agent — planning

on:
  issues:
    types: [opened, labeled]

jobs:
  plan:
    if: >-
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'feature-request')) ||
      (github.event.action == 'labeled' &&
        (github.event.label.name == 'feature-request' || github.event.label.name == 'product:relatorio-japao') &&
        contains(github.event.issue.labels.*.name, 'feature-request') &&
        contains(join(github.event.issue.labels.*.name, ','), 'product:'))
    concurrency:
      group: po-planning-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Skip if already planned
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          already=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            --jq '[.[] | select(.body | startswith("<!-- po-agent:plan -->"))] | length')
          echo "already_planned=$([ "$already" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Post initial status comment
        if: steps.guard.outputs.already_planned == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🤖 Feature request recebida — quebrando em user stories..."

      - name: Load PO persona
        if: steps.guard.outputs.already_planned == 'false'
        id: persona
        run: |
          {
            echo 'text<<PERSONA_EOF'
            cat .github/agents/po-agent-prompt.md
            echo 'PERSONA_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.already_planned == 'false'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'enrich-claude[bot]'
          claude_args: '--allowedTools "Read,Write,Grep,Glob,Bash(gh auth status:*),Bash(gh issue view:*),Bash(gh issue comment:*)" --permission-mode dontAsk'
          prompt: |
            ${{ steps.persona.outputs.text }}

            ---

            Tarefa: nova feature request recebida.

            Issue: #${{ github.event.issue.number }}
            Título: ${{ github.event.issue.title }}
            Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}

            Corpo da issue:
            ${{ github.event.issue.body }}

            Todos os dados relevantes da issue já estão acima — não é preciso rodar `gh issue view` nem `gh auth status` para confirmá-los. Quebre esta feature request em user stories seguindo o formato definido na sua persona. Em vez de publicar um comentário novo, edite o comentário de status publicado no início desta execução com `gh issue comment ${{ github.event.issue.number }} --edit-last --body-file <arquivo>` (grave o corpo num arquivo antes, com a ferramenta Write) no repositório ${{ github.repository }}.
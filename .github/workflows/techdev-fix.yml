name: Tech Dev Agent — apply review feedback

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  fix:
    if: github.event_name == 'pull_request' && github.event.label.name == 'qa:changes-requested'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Post initial status comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "🤖 QA pediu mudanças — aplicando correções..."

      - name: Load Tech Dev implementation persona
        id: persona
        run: |
          {
            echo 'text<<PERSONA_EOF'
            cat .github/agents/techdev-implement-prompt.md
            echo 'PERSONA_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'enrich-claude[bot]'
          claude_args: '--allowedTools "Read,Edit,Write,Grep,Glob,Bash(gh auth status:*),Bash(gh pr view:*),Bash(git:*),Bash(pip install:*),Bash(python manage.py:*),Bash(pytest:*),Bash(npm install:*),Bash(npm ci:*),Bash(npm run:*),Bash(npx:*),Bash(gh pr comment:*),Bash(gh pr diff:*)" --permission-mode dontAsk'
          prompt: |
            ${{ steps.persona.outputs.text }}

            ---

            Tarefa: o agente de QA pediu mudanças no Pull Request #${{ github.event.pull_request.number }} do repositório ${{ github.repository }}, branch `${{ github.event.pull_request.head.ref }}`.

            Leia os comentários do PR (gh pr view ${{ github.event.pull_request.number }} --comments) para ver o pedido de mudanças mais recente do agente de QA, aplique as correções necessárias na branch atual, faça push nela (não crie um PR novo). Em vez de publicar um comentário novo, edite o comentário de status publicado no início desta execução — `gh pr comment ${{ github.event.pull_request.number }} --edit-last --body "..."` — indicando o que foi corrigido.

  fix_from_comment:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '@claude ask')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: React to triggering comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes

      - name: Post initial status comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🤖 Ajuste pedido via comentário — analisando..."

      - name: Resolve PR head branch
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ref=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName -q .headRefName)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Load Tech Dev implementation persona
        id: persona
        run: |
          {
            echo 'text<<PERSONA_EOF'
            cat .github/agents/techdev-implement-prompt.md
            echo 'PERSONA_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'enrich-claude[bot]'
          claude_args: '--allowedTools "Read,Edit,Write,Grep,Glob,Bash(gh auth status:*),Bash(gh pr view:*),Bash(git:*),Bash(pip install:*),Bash(python manage.py:*),Bash(pytest:*),Bash(npm install:*),Bash(npm ci:*),Bash(npm run:*),Bash(npx:*),Bash(gh pr comment:*),Bash(gh pr diff:*)" --permission-mode dontAsk'
          prompt: |
            ${{ steps.persona.outputs.text }}

            ---

            Tarefa: no Pull Request #${{ github.event.issue.number }} do repositório ${{ github.repository }}, branch `${{ steps.pr.outputs.ref }}`, foi pedido um ajuste via comentário (`@claude ask`).

            Comentário: ${{ github.event.comment.body }}

            Leia o comentário (e o restante da conversa do PR com `gh pr view ${{ github.event.issue.number }} --comments`, se precisar de mais contexto), aplique as correções necessárias na branch atual, faça push nela (não crie um PR novo). Em vez de publicar um comentário novo, edite o comentário de status publicado no início desta execução — `gh pr comment ${{ github.event.issue.number }} --edit-last --body "..."` — indicando o que foi corrigido.